name: CI
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Build
        run: swift build
      - name: Test
        run: swift test
      - name: Test Codex question delivery
        run: python3 -m unittest discover -s Tests -p 'test_codex_reply.py' -v
